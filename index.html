<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Agentic Development Portfolio</title>

  <link rel="stylesheet" href="css/style.css">
</head>

<body>

<main class="table-scene">

  <!-- Primary portfolio area -->
  <section class="dm-screen" aria-label="Agentic Development artifacts">

    <div class="dm-screen__panel dm-screen__panel--left">

      <article class="module-card" id="artifact-1">
        <a href="#" class="module-card__link">
          <span class="module-card__code">A1</span>

          <div class="module-card__art">
            <!-- Cover artwork will go here -->
          </div>

          <div class="module-card__title">
            <h2>Artifact One</h2>
            <p>Something I Will Use</p>
          </div>
        </a>
      </article>


      <article class="module-card" id="artifact-2">
        <a href="#" class="module-card__link">
          <span class="module-card__code">A2</span>

          <div class="module-card__art">
            <!-- Cover artwork will go here -->
          </div>

          <div class="module-card__title">
            <h2>Artifact Two</h2>
            <p>Something With AI</p>
          </div>
        </a>
      </article>

    </div>


    <div class="dm-screen__panel dm-screen__panel--center">

      <header class="portfolio-title">
        <p>Advanced</p>
        <h1>Agentic Development</h1>
        <p>Portfolio of Adventures</p>
      </header>


      <article class="module-card" id="artifact-3">
        <a href="#" class="module-card__link">
          <span class="module-card__code">A3</span>

          <div class="module-card__art">
            <!-- Cover artwork will go here -->
          </div>

          <div class="module-card__title">
            <h2>Artifact Three</h2>
            <p>Something for Someone Else</p>
          </div>
        </a>
      </article>


      <article class="module-card" id="artifact-4">
        <a href="#" class="module-card__link">
          <span class="module-card__code">A4</span>

          <div class="module-card__art">
            <!-- Cover artwork will go here -->
          </div>

          <div class="module-card__title">
            <h2>Artifact Four</h2>
            <p>The Moonshot</p>
          </div>
        </a>
      </article>

    </div>


    <div class="dm-screen__panel dm-screen__panel--right">

      <article class="module-card" id="artifact-5">
        <a href="#" class="module-card__link">
          <span class="module-card__code">A5</span>

          <div class="module-card__art">
            <!-- Cover artwork will go here -->
          </div>

          <div class="module-card__title">
            <h2>Artifact Five</h2>
            <p>Final Artifact</p>
          </div>
        </a>
      </article>


      <article class="module-card module-card--bonus" id="artifact-extra">
        <a href="#" class="module-card__link">
          <span class="module-card__code">X1</span>

          <div class="module-card__art">
            <!-- Cover artwork will go here -->
          </div>

          <div class="module-card__title">
            <h2>Side Quest</h2>
            <p>Extra Credit Artifact</p>
          </div>
        </a>
      </article>

    </div>

  </section>

<!--
  Secondary tabletop objects
  <section class="tabletop-tools" aria-label="Portfolio resources">

    <button class="table-object documentation-book" type="button">
      <span>Developer's Handbook</span>
      <small>Documentation</small>
    </button>


    <button class="table-object development-journal" type="button">
      <span>Development Journal</span>
    </button>


    <div class="dice-area" aria-label="Dice roller">

      <button class="die" type="button" data-sides="6">
        d6
      </button>

      <button class="die" type="button" data-sides="20">
        d20
      </button>

      <output class="dice-result" aria-live="polite"></output>

    </div>

  </section>
  -->

</main>


<script src="js/script.js"></script>

</body>
</html>
